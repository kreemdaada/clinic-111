name: Test Production SSH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-preflight:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Verify production SSH preflight
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/deploy_key \
            -p "${DEPLOY_PORT}" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail

          echo "SSH_CONNECTION_OK"

          user="$(whoami)"
          echo "User: ${user}"
          if [[ "${user}" != "deploy" ]]; then
            echo "Expected deploy user." >&2
            exit 1
          fi

          echo "Hostname: $(hostname)"

          arch="$(uname -m)"
          echo "Architecture: ${arch}"
          if [[ "${arch}" != "x86_64" ]]; then
            echo "Expected x86_64 architecture." >&2
            exit 1
          fi

          docker_version="$(docker version --format '{{.Server.Version}}')"
          echo "Docker: ${docker_version}"
          if [[ -z "${docker_version}" ]]; then
            echo "Docker server version unavailable." >&2
            exit 1
          fi

          compose_version="$(docker compose version --short)"
          echo "Docker Compose: ${compose_version}"
          if [[ -z "${compose_version}" ]]; then
            echo "Docker Compose unavailable." >&2
            exit 1
          fi

          deploy_root="/opt/dentalfinance"
          tmp_file="$(mktemp "${deploy_root}/.ssh-preflight.XXXXXX")"
          cleanup_tmp() {
            rm -f "${tmp_file}"
          }
          trap cleanup_tmp EXIT

          : > "${tmp_file}"
          echo "DEPLOY_DIRECTORY_WRITABLE"

          app_env="${deploy_root}/app.env"
          if [[ ! -f "${app_env}" ]]; then
            echo "Missing ${app_env}." >&2
            exit 1
          fi
          echo "APP_ENV_PRESENT"

          app_env_owner="$(stat -c '%U' "${app_env}")"
          if [[ "${app_env_owner}" != "deploy" ]]; then
            echo "app.env owner must be deploy." >&2
            exit 1
          fi
          echo "APP_ENV_OWNER_OK"

          app_env_mode="$(stat -c '%a' "${app_env}")"
          if [[ "${app_env_mode}" != "600" ]]; then
            echo "app.env permissions must be 600." >&2
            exit 1
          fi
          echo "APP_ENV_PERMISSIONS_OK"

          echo "PRODUCTION_SSH_PREFLIGHT_OK"
          REMOTE_SCRIPT
